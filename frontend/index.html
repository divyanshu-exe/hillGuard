<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2316A36A'><path d='M12 2L2 22h20L12 2zm0 4.5l6.5 13.5h-13L12 6.5z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123B2A" />
    <meta name="description" content="HillGuard: Real-Time Landslide Detection & Road-Blockage Alert System for Arunachal Pradesh. NIT Arunachal Pradesh B.Tech Minor Project." />
    <link rel="manifest" href="/manifest.json" />
    <title>HillGuard | Real-Time Landslide Monitoring & Road Safety</title>
  </head>
  <body class="bg-[#F5F8F6] text-slate-800 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          // In local development, unregister service workers and clear cache to prevent stale assets
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (const registration of registrations) {
              registration.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then(names => {
              for (const name of names) {
                caches.delete(name);
              }
            });
          }
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then(reg => console.log('[PWA] Service Worker registered:', reg.scope))
              .catch(err => console.log('[PWA] Service Worker registration failed:', err));
          });
        }
      }
    </script>
  </body>
</html>
